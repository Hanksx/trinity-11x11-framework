name: Trinity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trinity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q core tests trinity_solver_tauri/src-tauri/solver_backend
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: TypeScript and Vite (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trinity_solver_tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, sync Python backend and compile Vite
        run: npm run build
      - name: Check build outputs
        run: |
          test -s dist/index.html
          test -s src-tauri/solver_backend/trinity_solver_engine_v1.py

  native-macos:
    name: Tauri/Rust and macOS app (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      TRINITY_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Python and NumPy
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy
        run: python -m pip install -r requirements.txt
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: trinity_solver_tauri
        run: npm ci --no-audit --no-fund
      - name: Build frontend and synchronize backend
        working-directory: trinity_solver_tauri
        run: npm run build
      - name: Check Rust formatting
        run: rustfmt --check --edition 2021 trinity_solver_tauri/src-tauri/src/main.rs
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path trinity_solver_tauri/src-tauri/Cargo.toml
      - name: Build macOS application bundle
        working-directory: trinity_solver_tauri
        run: npm run tauri:build
      - name: Verify application bundle exists
        run: |
          test -d trinity_solver_tauri/src-tauri/target/release/bundle/macos
          find trinity_solver_tauri/src-tauri/target/release/bundle/macos -type d -name '*.app' -print | grep -q '\.app$'
      - name: Archive unsigned macOS application
        run: |
          app="trinity_solver_tauri/src-tauri/target/release/bundle/macos/Trinity Solver.app"
          test -x "$app/Contents/MacOS/trinity_solver_gui"
          test -s "$app/Contents/Resources/solver_backend/runner.py"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/trinity-solver-macos-intel-unsigned.zip"
          unzip -tq "$RUNNER_TEMP/trinity-solver-macos-intel-unsigned.zip"
      - name: Upload unsigned macOS build
        uses: actions/upload-artifact@v4
        with:
          name: trinity-solver-macos-intel-unsigned
          path: ${{ runner.temp }}/trinity-solver-macos-intel-unsigned.zip
          if-no-files-found: error
          retention-days: 7
